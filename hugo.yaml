baseURL: "https://glory-hinody.pages.dev/"
theme: PaperMod
title: "Glory Hinody"
defaultContentLanguage: "vi"
defaultContentLanguageInSubdir: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: "Lê Quang Vinh"
  title: "Glory Hinody"
  keywords: ["AI Engineer", "Generative AI", "Video Diffusion", "GraphRAG", "On-Device AI", "Lê Quang Vinh", "PaperMod"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  comments: true
  ShareButtons: ["facebook", "linkedin", "telegram", "x"]

  homeInfoParams:
    Title: "Glory Hinody"
    Content: "Technical logbook của Lê Quang Vinh (AI Engineer)."
    AlignSocialIconsTo: left

  socialIcons:
    - name: "github"
      url: "https://github.com/vinh-gogo"
      title: "GitHub"
    - name: "linkedin"
      url: "https://linkedin.com/in/quangvinh2302"
      title: "LinkedIn"
    - name: "email"
      url: "mailto:lea26462@gmail.com"
      title: "Email"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

languages:
  vi:
    locale: "vi"
    label: "VI"
    weight: 1
    title: "Glory Hinody"
    params:
      description: "Technical logbook của Lê Quang Vinh (AI Engineer). Chuyên sâu về Generative AI, Video Diffusion, GraphRAG và On-Device AI."
      homeInfoParams:
        Title: "Glory Hinody"
        Content: "Technical logbook của Lê Quang Vinh (AI Engineer)."
    menu:
      main:
        - { name: "BÀI VIẾT", url: "/posts/", weight: 1 }
        - { name: "CHỦ ĐỀ", url: "/tags/", weight: 2 }
        - { name: "TÌM KIẾM", url: "/search/", weight: 3 }
        - { name: "TÁC GIẢ", url: "/about/", weight: 4 }
  en:
    locale: "en"
    label: "EN"
    weight: 2
    title: "Glory Hinody"
    params:
      description: "Technical logbook of Le Quang Vinh (AI Engineer). Focusing on Generative AI, Video Diffusion, GraphRAG, and On-Device AI."
      homeInfoParams:
        Title: "Glory Hinody"
        Content: "Technical logbook of Le Quang Vinh (AI Engineer)."
    menu:
      main:
        - { name: "POSTS", url: "/en/posts/", weight: 1 }
        - { name: "TAGS", url: "/en/tags/", weight: 2 }
        - { name: "SEARCH", url: "/en/search/", weight: 3 }
        - { name: "ABOUT", url: "/en/about/", weight: 4 }

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
            - ["$", "$"]
