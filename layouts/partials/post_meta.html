<div class="single-post-meta">
  <div class="single-meta-row">
    <span class="meta-tag">// LOG</span>
    <span class="meta-slash">/</span>
    {{- if not .Date.IsZero }}
    <time class="meta-date">{{ .Date.Format "2006.01.02" }}</time>
    <span class="meta-slash">/</span>
    {{- end }}
    {{- if (.Param "ShowReadingTime") }}
    <span class="meta-readtime">{{ printf "%02d" .ReadingTime }} MIN READ</span>
    <span class="meta-slash">/</span>
    {{- end }}
    <div class="post-stats-pill notranslate" translate="no">
      <a href="#comments" class="stat-badge stat-likes" title="Lượt thích / Phản hồi (Giscus)"><svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="stat-label">REACTION:</span><span class="stat-count">0</span></a>
      <span class="stat-sep">/</span>
      <a href="#comments" class="stat-badge stat-comments" title="Bình luận qua GitHub Discussions"><svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="stat-label">COMMENTS:</span><span class="stat-count">0</span></a>
      <span class="stat-sep">/</span>
      <span class="stat-badge stat-shares" title="Lượt chia sẻ"><svg class="stat-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span class="stat-label">SHARES:</span><span class="stat-count">0</span></span>
    </div>
  </div>

  {{- with (.Param "tags") }}
  <div class="single-tags-row notranslate" translate="no">
    <span class="tags-label">TAGS //</span>
    {{- range . }}
    <a href="{{ printf "/tags/%s/" (. | urlize) | absLangURL }}" class="tag-bracket">[{{ . }}]</a>
    {{- end }}
  </div>
  {{- end }}
</div>
