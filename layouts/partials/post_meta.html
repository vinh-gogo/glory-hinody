<div class="single-post-meta">
  <div class="single-meta-row">
    <span class="meta-tag">// LOG</span>
    <span class="meta-slash">/</span>
    {{- if not .Date.IsZero }}
    <time class="meta-date">{{ .Date.Format "2006.01.02" }}</time>
    <span class="meta-slash">/</span>
    {{- end }}
    {{- if (.Param "ShowReadingTime") }}
    <span class="meta-readtime">{{ printf "%02d" .ReadingTime }} MIN READ</span>
    <span class="meta-slash">/</span>
    {{- end }}
    <div class="post-stats-pill">
      <span class="stat-badge stat-likes" title="Reactions">
        <span class="stat-label">REACTION:</span>
        <span class="stat-count">0</span>
      </span>
      <span class="stat-sep">/</span>
      <span class="stat-badge stat-comments" title="Bình luận">
        <span class="stat-label">COMMENTS:</span>
        <span class="stat-count">0</span>
      </span>
      <span class="stat-sep">/</span>
      <span class="stat-badge stat-shares" title="Chia sẻ">
        <span class="stat-label">SHARES:</span>
        <span class="stat-count">0</span>
      </span>
    </div>
  </div>

  {{- with (.Param "tags") }}
  <div class="single-tags-row">
    <span class="tags-label">TAGS //</span>
    {{- range . }}
    <a href="/tags/{{ . | urlize }}/" class="tag-bracket">[{{ . }}]</a>
    {{- end }}
  </div>
  {{- end }}
</div>
