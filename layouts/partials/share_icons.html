{{- $isEn := eq .Lang "en" }}
{{- $pageurl := .Permalink }}
{{- $title := .Title }}

<div class="editorial-share-bar glass-card">
  <span class="nm-label share-label">{{ if $isEn }}SHARE MONOGRAPH{{ else }}CHIA SẺ BÀI VIẾT{{ end }}</span>
  <div class="share-actions">
    <a target="_blank" rel="noopener noreferrer" class="nm-chip share-action-link" href="https://www.facebook.com/sharer/sharer.php?u={{ $pageurl | urlquery }}">Facebook ↗</a>
    <a target="_blank" rel="noopener noreferrer" class="nm-chip share-action-link" href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ $pageurl | urlquery }}&amp;title={{ $title | urlquery }}">LinkedIn ↗</a>
    <a target="_blank" rel="noopener noreferrer" class="nm-chip share-action-link" href="https://telegram.me/share/url?text={{ $title | urlquery }}&amp;url={{ $pageurl | urlquery }}">Telegram ↗</a>
    <a target="_blank" rel="noopener noreferrer" class="nm-chip share-action-link" href="https://x.com/intent/tweet/?text={{ $title | urlquery }}&amp;url={{ $pageurl | urlquery }}">X ↗</a>
    <button type="button" class="nm-chip share-action-btn" id="btn-copy-share-url">
      {{ if $isEn }}Copy Link{{ else }}Sao chép liên kết{{ end }}
    </button>
  </div>
</div>
