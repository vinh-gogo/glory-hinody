{{- if .Store.Get "hasMermaid" }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
  integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
  crossorigin="anonymous"></script>
<script>
  (function() {
    function initMermaid() {
      if (typeof mermaid === "undefined") return;

      var isDark = document.documentElement.dataset.theme === "dark" || 
                   (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);

      document.querySelectorAll('.mermaid').forEach(function(el) {
        if (!el.getAttribute('data-mermaid-src')) {
          el.setAttribute('data-mermaid-src', el.textContent.trim());
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'antiscript', /* 'loose' → XSS risk, 'antiscript' blocks <script> but keeps htmlLabels */
        theme: isDark ? 'dark' : 'neutral',
        fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
        fontSize: 12,
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          nodeSpacing: 22,
          rankSpacing: 26,
          padding: 8,
          curve: 'basis'
        },
        themeVariables: isDark ? {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#161a22',
          primaryTextColor: '#f0f3f6',
          primaryBorderColor: '#c8f049',
          lineColor: '#c8f049',
          secondaryColor: '#11141a',
          tertiaryColor: '#090b0e',
          background: '#090b0e',
          mainBkg: '#11141a',
          nodeBorder: '#333b47',
          clusterBkg: '#0d1015',
          clusterBorder: '#222730'
        } : {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#ffffff',
          primaryTextColor: '#14171a',
          primaryBorderColor: '#15803d',
          lineColor: '#15803d',
          background: '#fafaf8',
          mainBkg: '#ffffff',
          nodeBorder: '#c8ccc0',
          clusterBkg: '#f2f3ee',
          clusterBorder: '#e2e4dc'
        }
      });

      try {
        var p = mermaid.run({ querySelector: '.mermaid' });
        if (p && typeof p.catch === "function") {
          p.catch(function(err) {
            console.error("Mermaid run error:", err);
          });
        }
      } catch (err) {
        console.error("Mermaid render error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
      initMermaid();
    }

    var themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function() {
        setTimeout(function() {
          document.querySelectorAll('.mermaid').forEach(function(el) {
            var src = el.getAttribute('data-mermaid-src');
            if (src) {
              el.innerHTML = src;
              el.removeAttribute('data-processed');
            }
          });
          initMermaid();
        }, 60);
      });
    }
  })();
</script>
{{- end }}

{{- if or .Params.math (eq .Kind "page") }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
  integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
  crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
  crossorigin="anonymous" onload="renderKatexMath()"></script>
<script>
  function renderKatexMath() {
    if (typeof renderMathInElement !== "function") return;
    var target = document.querySelector('.post-content') || document.querySelector('.main');
    if (!target) return;
    renderMathInElement(target, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      ignoredClasses: ["mermaid", "highlight", "no-math", "copy-code"],
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option", "svg"],
      throwOnError: false
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", renderKatexMath);
  } else {
    renderKatexMath();
  }
</script>
{{- end }}

<!-- Client-side Language Switcher (VI / EN) via Google Translate cookie -->
<div id="google_translate_element" class="google-translate-hidden notranslate" translate="no"></div>
<script>
  (function () {

    /* ══ 1. Suppress translate UI — không ảnh hưởng tới init ════════ */
    function suppressBanner() {
      [
        'iframe.goog-te-banner-frame', '.goog-te-banner-frame',
        '[class*="VIpgJd-ZVi9od"]', 'iframe[id^="goog-gt-"]',
        'iframe[class*="goog-te-"]', '#goog-gt-tt', '#goog-gt-vt',
        '.goog-te-balloon-frame', '.goog-te-ftab-frame'
      ].forEach(function (sel) {
        try {
          document.querySelectorAll(sel).forEach(function (el) {
            el.style.setProperty('display',     'none',   'important');
            el.style.setProperty('visibility',  'hidden', 'important');
            el.style.setProperty('height',      '0',      'important');
          });
        } catch (e) {}
      });
    }

    /* ══ 2. Chỉ fix body.top — KHÔNG gọi suppressBanner trong MO ═══ */
    function watchBodyTop() {
      if (typeof MutationObserver === 'undefined') return;
      var mo = new MutationObserver(function () {
        var b = document.body;
        if (!b) return;
        if (b.style.top && b.style.top !== '' && b.style.top !== '0px') {
          b.style.setProperty('top', '0', 'important');
        }
        if (b.style.position === 'relative') {
          b.style.setProperty('position', 'static', 'important');
        }
      });
      function attach() {
        if (document.body)
          mo.observe(document.body, { attributes: true, attributeFilter: ['style'] });
        if (document.documentElement)
          mo.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
      }
      document.readyState === 'loading'
        ? document.addEventListener('DOMContentLoaded', attach)
        : attach();
    }

    /* ══ 3. Bảo vệ code / math khỏi bị dịch ═══════════════════════ */
    function protectCodeAndMath() {
      [
        'pre', 'code', '.highlight', '.chroma',
        '.mermaid', '[data-mermaid-src]',
        '.katex', '.katex-display', '.katex-html', 'math',
        'svg', '.stat-badge', '.tech-chip', '.tag-bracket',
        '.lang-switcher', '.post-stats-pill', '.hero-tech-stack',
        '.terminal-toast'
      ].forEach(function (sel) {
        document.querySelectorAll(sel).forEach(function (el) {
          el.classList.add('notranslate');
          el.setAttribute('translate', 'no');
        });
      });
    }

    /* ══ 4. Toast ═══════════════════════════════════════════════════ */
    function showToast(prefix, msg) {
      var toast = document.getElementById('terminal-lang-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id        = 'terminal-lang-toast';
        toast.className = 'terminal-toast notranslate';
        toast.setAttribute('translate', 'no');
        document.body.appendChild(toast);
      }
      toast.innerHTML = '<span class="toast-prefix">' + prefix + '</span>' + msg;
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2400);
    }

    /* ══ 5. Cookie helpers ══════════════════════════════════════════ */
    function setGoogCookie(val) {
      var exp = new Date(Date.now() + 30 * 864e5).toUTCString();
      /* Xoá trước, set sau — tránh duplicate */
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = 'googtrans=' + val + '; expires=' + exp + '; path=/;';
    }
    function clearGoogCookie() {
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + location.hostname + ';';
    }

    /* ══ 6. Trạng thái nút VI / EN ══════════════════════════════════ */
    function updateButtons() {
      var isEn = localStorage.getItem('user_lang') === 'en';
      var vi = document.getElementById('btn-lang-vi');
      var en = document.getElementById('btn-lang-en');
      if (vi && en) {
        en.classList.toggle('active', isEn);
        vi.classList.toggle('active', !isEn);
      }
    }

    /* ══ 7. PUBLIC API: switchLanguage ══════════════════════════════
     *
     *  Cơ chế: cookie + reload.
     *  - Đặt / xoá cookie  googtrans=/vi/en
     *  - Google Translate đọc cookie này tự động khi load lại trang
     *  - Không cần poll .goog-te-combo  →  không có infinite-reload risk
     * ════════════════════════════════════════════════════════════ */
    window.switchLanguage = function (lang) {
      var current = localStorage.getItem('user_lang') || 'vi';
      if (current === lang) return;

      if (lang === 'en') {
        localStorage.setItem('user_lang', 'en');
        setGoogCookie('/vi/en');
        updateButtons();
        showToast('// I18N:', 'Switching to English...');
        setTimeout(function () { location.reload(); }, 380);

      } else {
        localStorage.setItem('user_lang', 'vi');
        clearGoogCookie();
        updateButtons();
        showToast('// I18N:', 'Khôi phục Tiếng Việt gốc...');
        setTimeout(function () { location.reload(); }, 380);
      }
    };

    /* ══ 8. Google Translate init callback ══════════════════════════ */
    window.googleTranslateElementInit = function () {
      new google.translate.TranslateElement({
        pageLanguage:      'vi',
        includedLanguages: 'vi,en',
        autoDisplay:       false   /* Không tự mở toolbar */
      }, 'google_translate_element');

      /* Ẩn banner sau khi widget init xong */
      suppressBanner();
      setTimeout(suppressBanner, 300);
    };

    /* ══ 9. Bootstrap ═══════════════════════════════════════════════ */
    watchBodyTop();
    suppressBanner();

    function onReady() {
      protectCodeAndMath();
      updateButtons();
      suppressBanner();
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', onReady)
      : onReady();

    window.addEventListener('load', function () {
      protectCodeAndMath();
      updateButtons();
      suppressBanner();
    });

    /* Safety suppression sau khi Google Translate hoàn toàn xong */
    setTimeout(suppressBanner, 1000);
    setTimeout(suppressBanner, 2000);

  }());
</script>
<script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
