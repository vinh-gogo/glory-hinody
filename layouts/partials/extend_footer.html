{{- if .Store.Get "hasMermaid" }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
  integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
  crossorigin="anonymous"></script>
<script>
  (function() {
    function initMermaid() {
      if (typeof mermaid === "undefined") return;

      var isDark = document.documentElement.dataset.theme === "dark" || 
                   (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);

      document.querySelectorAll('.mermaid').forEach(function(el) {
        if (!el.getAttribute('data-mermaid-src')) {
          el.setAttribute('data-mermaid-src', el.textContent.trim());
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'antiscript', /* 'loose' → XSS risk, 'antiscript' blocks <script> but keeps htmlLabels */
        theme: isDark ? 'dark' : 'neutral',
        fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
        fontSize: 12,
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          nodeSpacing: 22,
          rankSpacing: 26,
          padding: 8,
          curve: 'basis'
        },
        themeVariables: isDark ? {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#161a22',
          primaryTextColor: '#f0f3f6',
          primaryBorderColor: '#c8f049',
          lineColor: '#c8f049',
          secondaryColor: '#11141a',
          tertiaryColor: '#090b0e',
          background: '#090b0e',
          mainBkg: '#11141a',
          nodeBorder: '#333b47',
          clusterBkg: '#0d1015',
          clusterBorder: '#222730'
        } : {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#ffffff',
          primaryTextColor: '#14171a',
          primaryBorderColor: '#15803d',
          lineColor: '#15803d',
          background: '#fafaf8',
          mainBkg: '#ffffff',
          nodeBorder: '#c8ccc0',
          clusterBkg: '#f2f3ee',
          clusterBorder: '#e2e4dc'
        }
      });

      try {
        var p = mermaid.run({ querySelector: '.mermaid' });
        if (p && typeof p.catch === "function") {
          p.catch(function(err) {
            console.error("Mermaid run error:", err);
          });
        }
      } catch (err) {
        console.error("Mermaid render error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
      initMermaid();
    }

    var themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function() {
        setTimeout(function() {
          document.querySelectorAll('.mermaid').forEach(function(el) {
            var src = el.getAttribute('data-mermaid-src');
            if (src) {
              el.innerHTML = src;
              el.removeAttribute('data-processed');
            }
          });
          initMermaid();
        }, 60);
      });
    }
  })();
</script>
{{- end }}

{{- if or .Params.math (eq .Kind "page") }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
  integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
  crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
  crossorigin="anonymous" onload="renderKatexMath()"></script>
<script>
  function renderKatexMath() {
    if (typeof renderMathInElement !== "function") return;
    var target = document.querySelector('.post-content') || document.querySelector('.main');
    if (!target) return;
    renderMathInElement(target, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      ignoredClasses: ["mermaid", "highlight", "no-math", "copy-code"],
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option", "svg"],
      throwOnError: false
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", renderKatexMath);
  } else {
    renderKatexMath();
  }
</script>
{{- end }}

<!-- Client-side Instant Translation Switcher (VI / EN) -->
<div id="google_translate_element" class="google-translate-hidden notranslate" translate="no"></div>
<script>
  (function() {

    /* ── 1. Ẩn banner ngay khi có — chạy cực sớm ─────────────────── */
    function suppressTranslateBanner() {
      var selectors = [
        'iframe.goog-te-banner-frame',
        '.goog-te-banner-frame',
        '.VIpgJd-ZVi9od-xl07Ob-OEVmcd',
        '.VIpgJd-ZVi9od-xl07Ob',
        '[class*="VIpgJd-ZVi9od"]',
        'iframe[id^="goog-gt-"]',
        'iframe[class*="goog-te-"]',
        '#goog-gt-tt', '#goog-gt-vt',
        '.goog-te-balloon-frame',
        '.goog-te-ftab-frame'
      ];
      selectors.forEach(function(sel) {
        try {
          document.querySelectorAll(sel).forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
            el.style.setProperty('visibility', 'hidden', 'important');
            el.style.setProperty('height', '0', 'important');
          });
        } catch(e) {}
      });
    }

    /* ── 2. Reset body.top ngay lập tức qua MutationObserver ─────── */
    /* Dùng MO thay setInterval → phản ứng trong cùng frame render   */
    function watchBodyTop() {
      // Xử lý ngay khi body style thay đổi
      var bodyObserver = new MutationObserver(function() {
        var b = document.body;
        if (!b) return;
        if (b.style.top && b.style.top !== '0px' && b.style.top !== '') {
          b.style.setProperty('top', '0', 'important');
        }
        if (b.style.position === 'relative') {
          b.style.setProperty('position', 'static', 'important');
        }
        suppressTranslateBanner();
      });
      if (document.body) {
        bodyObserver.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
        bodyObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
      }
      // Dự phòng nếu body chưa có
      document.addEventListener('DOMContentLoaded', function() {
        bodyObserver.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
        bodyObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
        suppressTranslateBanner();
      });
    }

    /* ── 3. Bảo vệ code/math khỏi bị dịch ───────────────────────── */
    function protectCodeAndMath() {
      var selectors = [
        'pre', 'code', '.highlight', '.chroma',
        '.mermaid', '[data-mermaid-src]',
        '.katex', '.katex-display', '.katex-html', 'math',
        'svg', '.stat-badge', '.tech-chip', '.tag-bracket',
        '.lang-switcher', '.post-stats-pill', '.hero-tech-stack',
        '.terminal-toast'
      ];
      selectors.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          el.classList.add('notranslate');
          el.setAttribute('translate', 'no');
        });
      });
    }

    /* ── 4. Toast thông báo ──────────────────────────────────────── */
    function showToast(prefix, msg) {
      var toast = document.getElementById('terminal-lang-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'terminal-lang-toast';
        toast.className = 'terminal-toast notranslate';
        toast.setAttribute('translate', 'no');
        document.body.appendChild(toast);
      }
      toast.innerHTML = '<span class="toast-prefix">' + prefix + '</span>' + msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2400);
    }

    /* ── 5. Cookie googtrans ─────────────────────────────────────── */
    function setCookie(val) {
      var exp = new Date(Date.now() + 30 * 864e5).toUTCString();
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = 'googtrans=' + val + '; expires=' + exp + '; path=/;';
    }
    function clearCookie() {
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = 'googtrans=/vi/vi; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    }

    /* ── 6. Cập nhật trạng thái nút VI / EN ─────────────────────── */
    function updateLangButtons() {
      var stored = localStorage.getItem('user_lang');
      var cookieMatch = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
      var isEn = (stored === 'en') || (cookieMatch && cookieMatch[1].indexOf('/en') !== -1);
      var btnVi = document.getElementById('btn-lang-vi');
      var btnEn = document.getElementById('btn-lang-en');
      if (btnVi && btnEn) {
        btnEn.classList.toggle('active', isEn);
        btnVi.classList.toggle('active', !isEn);
      }
    }

    /* ── 7. Apply EN translation — poll nhanh, retry tự động ─────── */
    function applyEnglish(onDone) {
      var attempts = 0;
      var maxAttempts = 40; // 40 × 100ms = 4 giây
      var timer = setInterval(function() {
        attempts++;
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          clearInterval(timer);
          if (select.value !== 'en') {
            select.value = 'en';
            select.dispatchEvent(new Event('change', { bubbles: true }));
            select.dispatchEvent(new Event('input',  { bubbles: true }));
          }
          suppressTranslateBanner();
          if (onDone) onDone();
        } else if (attempts >= maxAttempts) {
          clearInterval(timer);
          // Google Translate chưa load xong → reload để cookie apply
          window.location.reload();
        }
      }, 100);
    }

    /* ── 8. Public API: switchLanguage ───────────────────────────── */
    window.switchLanguage = function(lang) {
      protectCodeAndMath();
      var current = localStorage.getItem('user_lang') || 'vi';
      if (current === lang) return;

      if (lang === 'en') {
        localStorage.setItem('user_lang', 'en');
        setCookie('/vi/en');
        updateLangButtons();
        showToast('// I18N:', 'Switching to English...');
        applyEnglish();
      } else {
        localStorage.setItem('user_lang', 'vi');
        clearCookie();
        updateLangButtons();
        showToast('// I18N:', 'Khôi phục Tiếng Việt gốc...');
        setTimeout(function() { window.location.reload(); }, 300);
      }
    };

    /* ── 9. Google Translate init callback ───────────────────────── */
    window.googleTranslateElementInit = function() {
      new google.translate.TranslateElement({
        pageLanguage: 'vi',
        includedLanguages: 'vi,en',
        autoDisplay: false
      }, 'google_translate_element');

      suppressTranslateBanner();

      if (localStorage.getItem('user_lang') === 'en') {
        applyEnglish(suppressTranslateBanner);
      }
    };

    /* ── 10. Bootstrap ────────────────────────────────────────────── */
    // Chạy ngay lập tức
    watchBodyTop();
    suppressTranslateBanner();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        protectCodeAndMath();
        updateLangButtons();
        suppressTranslateBanner();
      });
    } else {
      protectCodeAndMath();
      updateLangButtons();
      suppressTranslateBanner();
    }

    window.addEventListener('load', function() {
      protectCodeAndMath();
      updateLangButtons();
      suppressTranslateBanner();
    });

    // Extra safety: suppress banner thêm 1 lần sau 800ms
    // (thời điểm Google Translate thường mới xong init)
    setTimeout(suppressTranslateBanner, 800);
    setTimeout(suppressTranslateBanner, 1500);

  })();
</script>
<script defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
