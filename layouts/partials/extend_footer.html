{{- if .Store.Get "hasMermaid" }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  (function() {
    function initMermaid() {
      if (typeof mermaid === "undefined") return;

      var isDark = document.documentElement.dataset.theme === "dark" || 
                   (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);

      document.querySelectorAll('.mermaid').forEach(function(el) {
        if (!el.getAttribute('data-mermaid-src')) {
          el.setAttribute('data-mermaid-src', el.textContent.trim());
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: isDark ? 'dark' : 'neutral',
        fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
        fontSize: 12,
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          nodeSpacing: 22,
          rankSpacing: 26,
          padding: 8,
          curve: 'basis'
        },
        themeVariables: isDark ? {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#161a22',
          primaryTextColor: '#f0f3f6',
          primaryBorderColor: '#c8f049',
          lineColor: '#c8f049',
          secondaryColor: '#11141a',
          tertiaryColor: '#090b0e',
          background: '#090b0e',
          mainBkg: '#11141a',
          nodeBorder: '#333b47',
          clusterBkg: '#0d1015',
          clusterBorder: '#222730'
        } : {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#ffffff',
          primaryTextColor: '#14171a',
          primaryBorderColor: '#15803d',
          lineColor: '#15803d',
          background: '#fafaf8',
          mainBkg: '#ffffff',
          nodeBorder: '#c8ccc0',
          clusterBkg: '#f2f3ee',
          clusterBorder: '#e2e4dc'
        }
      });

      try {
        var p = mermaid.run({ querySelector: '.mermaid' });
        if (p && typeof p.catch === "function") {
          p.catch(function(err) {
            console.error("Mermaid run error:", err);
          });
        }
      } catch (err) {
        console.error("Mermaid render error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
      initMermaid();
    }

    var themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function() {
        setTimeout(function() {
          document.querySelectorAll('.mermaid').forEach(function(el) {
            var src = el.getAttribute('data-mermaid-src');
            if (src) {
              el.innerHTML = src;
              el.removeAttribute('data-processed');
            }
          });
          initMermaid();
        }, 60);
      });
    }
  })();
</script>
{{- end }}

{{- if or .Params.math (eq .Kind "page") }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous" onload="renderKatexMath()"></script>
<script>
  function renderKatexMath() {
    if (typeof renderMathInElement !== "function") return;
    var target = document.querySelector('.post-content') || document.querySelector('.main');
    if (!target) return;
    renderMathInElement(target, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      ignoredClasses: ["mermaid", "highlight", "no-math", "copy-code"],
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option", "svg"],
      throwOnError: false
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", renderKatexMath);
  } else {
    renderKatexMath();
  }
</script>
{{- end }}

<!-- Client-side Instant Translation Switcher (VI / EN) -->
<div id="google_translate_element" style="display:none;" translate="no" class="notranslate"></div>
<script>
  (function() {
    function protectCodeAndMath() {
      var selectors = [
        'pre', 'code', '.highlight', '.chroma',
        '.mermaid', '[data-mermaid-src]',
        '.katex', '.katex-display', '.katex-html', 'math',
        'svg', '.stat-badge', '.tech-chip', '.tag-bracket',
        '.lang-switcher', '.post-stats-pill', '.hero-tech-stack'
      ];
      selectors.forEach(function(sel) {
        document.querySelectorAll(sel).forEach(function(el) {
          el.classList.add('notranslate');
          el.setAttribute('translate', 'no');
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', protectCodeAndMath);
    } else {
      protectCodeAndMath();
    }

    function setGoogleTransCookie(targetLang) {
      var val = (targetLang === 'en') ? '/vi/en' : '/vi/vi';
      var host = window.location.hostname;
      var expires = "expires=" + new Date(Date.now() + 30 * 864e5).toUTCString();
      
      document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "googtrans=" + val + "; " + expires + "; path=/";
      
      if (host && host.indexOf('.') !== -1) {
        var parts = host.split('.');
        if (parts.length > 1) {
          var domain = "." + parts.slice(-2).join('.');
          document.cookie = "googtrans=" + val + "; " + expires + "; path=/; domain=" + domain;
        }
      }
      localStorage.setItem('user_lang', targetLang);
    }

    function updateLangButtons() {
      var stored = localStorage.getItem('user_lang');
      var cookieMatch = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
      var isEn = (stored === 'en') || (cookieMatch && cookieMatch[1].indexOf('/en') !== -1);

      var btnVi = document.getElementById('btn-lang-vi');
      var btnEn = document.getElementById('btn-lang-en');
      if (btnVi && btnEn) {
        if (isEn) {
          btnEn.classList.add('active');
          btnVi.classList.remove('active');
        } else {
          btnVi.classList.add('active');
          btnEn.classList.remove('active');
        }
      }
    }

    window.switchLanguage = function(lang) {
      protectCodeAndMath();
      var current = localStorage.getItem('user_lang') || 'vi';
      if (current === lang) return;

      if (lang === 'en') {
        setGoogleTransCookie('en');
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = 'en';
          select.dispatchEvent(new Event('change'));
          updateLangButtons();
        } else {
          window.location.reload();
        }
      } else {
        setGoogleTransCookie('vi');
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + ('.' + window.location.hostname.split('.').slice(-2).join('.'));
        window.location.reload();
      }
    };

    updateLangButtons();
    window.addEventListener('load', function() {
      protectCodeAndMath();
      updateLangButtons();
    });

    window.googleTranslateElementInit = function() {
      new google.translate.TranslateElement({
        pageLanguage: 'vi',
        includedLanguages: 'vi,en',
        autoDisplay: false
      }, 'google_translate_element');
    };
  })();
</script>
<script defer src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
