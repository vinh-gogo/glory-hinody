{{- if .Store.Get "hasMermaid" }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
  integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
  crossorigin="anonymous"></script>
<script>
  (function() {
    function initMermaid() {
      if (typeof mermaid === "undefined") return;

      var isDark = document.documentElement.dataset.theme === "dark" || 
                   (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);

      document.querySelectorAll('.mermaid').forEach(function(el) {
        if (!el.getAttribute('data-mermaid-src')) {
          el.setAttribute('data-mermaid-src', el.textContent.trim());
        }
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'antiscript', /* 'loose' → XSS risk, 'antiscript' blocks <script> but keeps htmlLabels */
        theme: isDark ? 'dark' : 'neutral',
        fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
        fontSize: 12,
        flowchart: {
          useMaxWidth: true,
          htmlLabels: true,
          nodeSpacing: 22,
          rankSpacing: 26,
          padding: 8,
          curve: 'basis'
        },
        themeVariables: isDark ? {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#161a22',
          primaryTextColor: '#f0f3f6',
          primaryBorderColor: '#c8f049',
          lineColor: '#c8f049',
          secondaryColor: '#11141a',
          tertiaryColor: '#090b0e',
          background: '#090b0e',
          mainBkg: '#11141a',
          nodeBorder: '#333b47',
          clusterBkg: '#0d1015',
          clusterBorder: '#222730'
        } : {
          fontFamily: "'JetBrains Mono', 'Plus Jakarta Sans', monospace",
          fontSize: '12px',
          primaryColor: '#ffffff',
          primaryTextColor: '#14171a',
          primaryBorderColor: '#15803d',
          lineColor: '#15803d',
          background: '#fafaf8',
          mainBkg: '#ffffff',
          nodeBorder: '#c8ccc0',
          clusterBkg: '#f2f3ee',
          clusterBorder: '#e2e4dc'
        }
      });

      try {
        var p = mermaid.run({ querySelector: '.mermaid' });
        if (p && typeof p.catch === "function") {
          p.catch(function(err) {
            console.error("Mermaid run error:", err);
          });
        }
      } catch (err) {
        console.error("Mermaid render error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMermaid);
    } else {
      initMermaid();
    }

    var themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function() {
        setTimeout(function() {
          document.querySelectorAll('.mermaid').forEach(function(el) {
            var src = el.getAttribute('data-mermaid-src');
            if (src) {
              el.innerHTML = src;
              el.removeAttribute('data-processed');
            }
          });
          initMermaid();
        }, 60);
      });
    }
  })();
</script>
{{- end }}

{{- if or .Params.math (eq .Kind "page") }}
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
  integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
  crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk"
  crossorigin="anonymous" onload="renderKatexMath()"></script>
<script>
  function renderKatexMath() {
    if (typeof renderMathInElement !== "function") return;
    var target = document.querySelector('.post-content') || document.querySelector('.main');
    if (!target) return;
    renderMathInElement(target, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      ignoredClasses: ["mermaid", "highlight", "no-math", "copy-code"],
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option", "svg"],
      throwOnError: false
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", renderKatexMath);
  } else {
    renderKatexMath();
  }
</script>
{{- end }}
